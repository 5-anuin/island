<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>WYY的 ✦ 小岛 · 3D 个人主页</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%84%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   设计变量 · 深邃极光夜空蓝 + 冰霜白衬线
   ============================================================ */
:root{
  --bg-1:#040a18;
  --bg-2:#0a1a33;
  --bg-3:#123056;
  --ink:#eef5fd;
  --muted:#93a8c2;
  --faint:#6b81a0;
  --ice:#9fd8ec;
  --warm:#ffd9a0;
  --line:rgba(180,210,240,.16);
  --glass:rgba(11,25,47,.55);
  --glass-strong:rgba(9,20,40,.78);
  --serif:'Cormorant Garamond','Noto Serif SC',serif;
  --sans:'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-1);}
body{
  font-family:var(--sans);
  color:var(--ink);
  /* 极光夜空渐变：右上青绿色微弱极光 */
  background:
    radial-gradient(1100px 700px at 88% -10%, rgba(88,214,196,.14), transparent 60%),
    radial-gradient(900px 600px at 110% 8%, rgba(120,160,255,.10), transparent 55%),
    linear-gradient(160deg, var(--bg-3) 0%, var(--bg-2) 42%, var(--bg-1) 100%);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}
a{color:inherit;text-decoration:none;}
img{display:block;}
#scene-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}

/* ============================================================
   顶部导航
   ============================================================ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:26px 5vw;pointer-events:none;
}
.nav > *{pointer-events:auto;}
.brand{display:flex;align-items:center;gap:14px;}
.brand-logo{
  width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);
  display:grid;place-items:center;
  font-family:var(--serif);font-size:20px;color:var(--ice);
  background:rgba(159,216,236,.08);
  letter-spacing:.02em;
}
.brand-text .name{font-family:var(--serif);font-size:19px;letter-spacing:.14em;font-weight:600;}
.brand-text .sub{font-size:9.5px;letter-spacing:.32em;color:var(--faint);margin-top:3px;}
.nav-links{display:flex;align-items:center;gap:30px;}
.nav-links .link{
  font-size:13px;letter-spacing:.18em;color:var(--muted);
  transition:color .3s;position:relative;padding:4px 0;
}
.nav-links .link::after{
  content:'';position:absolute;left:0;bottom:0;width:0;height:1px;
  background:var(--ice);transition:width .35s ease;
}
.nav-links .link:hover{color:var(--ink);}
.nav-links .link:hover::after{width:100%;}
.pill-btn{
  border:1px solid var(--line);border-radius:999px;
  padding:10px 22px;font-size:12.5px;letter-spacing:.16em;white-space:nowrap;
  color:var(--ink);background:rgba(159,216,236,.07);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:all .35s;display:inline-flex;align-items:center;gap:8px;
}
.pill-btn:hover{background:rgba(159,216,236,.18);border-color:rgba(159,216,236,.5);transform:translateY(-1px);}

/* ============================================================
   首屏左侧杂志文案
   ============================================================ */
.landing-panel{
  position:fixed;z-index:20;
  left:7vw;top:52%;transform:translateY(-50%);
  width:min(42vw,540px);
  transition:opacity .75s ease, transform .75s ease;
}
.landing-panel.is-hidden{opacity:0;transform:translate(calc(-50% - 40px),-50%);pointer-events:none;}
.kicker{
  display:flex;align-items:center;gap:14px;
  font-size:11px;letter-spacing:.34em;color:var(--ice);
  margin-bottom:26px;font-weight:500;
}
.kicker::before{content:'';width:46px;height:1px;background:var(--ice);opacity:.7;}
.hero-title{
  font-family:var(--serif);
  font-size:clamp(40px,5.2vw,68px);
  line-height:1.18;font-weight:600;letter-spacing:.02em;
  text-shadow:0 6px 40px rgba(4,12,28,.6);
}
.hero-title .star{color:var(--ice);font-size:.72em;vertical-align:.12em;margin:0 .08em;}
.hero-intro{margin-top:26px;color:var(--muted);font-size:14.5px;line-height:2;letter-spacing:.06em;}
.hero-intro p+p{margin-top:6px;}
.cta-primary{
  margin-top:38px;white-space:nowrap;flex:none;
  display:inline-flex;align-items:center;gap:12px;
  padding:16px 34px;border-radius:999px;
  font-size:14px;letter-spacing:.22em;font-weight:500;
  color:#061224;
  background:linear-gradient(120deg,#eaf6ff 0%,#b9e2f2 55%,#8fcbe4 100%);
  box-shadow:0 12px 40px rgba(140,200,230,.28), inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .35s, box-shadow .35s;
}
.cta-primary:hover{transform:translateY(-2px);box-shadow:0 18px 50px rgba(140,200,230,.42), inset 0 1px 0 rgba(255,255,255,.7);}
.identity-tag{
  margin-top:42px;padding-top:20px;border-top:1px solid var(--line);
  font-size:11.5px;letter-spacing:.14em;color:var(--faint);line-height:1.9;
}

/* ============================================================
   底部信息栏
   ============================================================ */
.bottom-bar{
  position:fixed;left:0;right:0;bottom:26px;z-index:22;
  display:flex;align-items:flex-end;justify-content:center;
  padding:0 5vw;gap:20px;
  transition:opacity .6s ease;
}
.bottom-bar.is-hidden{opacity:0;pointer-events:none;}
.slogan{
  position:fixed;left:2.2vw;bottom:88px;
  font-size:10px;letter-spacing:.3em;color:var(--faint);
  writing-mode:vertical-rl;line-height:1.9;
}
.landmark-pill{
  display:flex;align-items:center;gap:4px;
  background:var(--glass);
  border:1px solid var(--line);border-radius:999px;
  padding:8px 10px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 10px 40px rgba(2,8,20,.45);
  max-width:80vw;overflow-x:auto;scrollbar-width:none;
}
.landmark-pill::-webkit-scrollbar{display:none;}
.landmark-pill button{
  display:flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:999px;white-space:nowrap;
  font-size:12px;letter-spacing:.1em;color:var(--muted);
  transition:all .3s;
}
.landmark-pill button .no{font-family:var(--serif);font-size:13px;color:var(--ice);letter-spacing:.05em;}
.landmark-pill button:hover{color:var(--ink);background:rgba(159,216,236,.12);}
.operate-hint{position:fixed;right:5vw;bottom:88px;font-size:10.5px;letter-spacing:.16em;color:var(--faint);text-align:right;line-height:2;}

/* ============================================================
   探索模式：返回按钮 / 功能开关
   ============================================================ */
.back-btn{
  position:fixed;top:26px;left:5vw;z-index:32;
  opacity:0;transform:translateY(-14px);pointer-events:none;
  transition:all .6s cubic-bezier(.22,1,.36,1);
}
.back-btn.show{opacity:1;transform:translateY(0);pointer-events:auto;}
.view-tools{
  position:fixed;right:5vw;bottom:26px;z-index:32;
  display:flex;flex-direction:column;gap:10px;align-items:flex-end;
  opacity:0;transform:translateY(14px);pointer-events:none;
  transition:all .6s cubic-bezier(.22,1,.36,1);
}
.view-tools.show{opacity:1;transform:translateY(0);pointer-events:auto;}
.tool-chip{
  display:flex;align-items:center;gap:10px;
  padding:10px 18px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font-size:12px;letter-spacing:.14em;color:var(--muted);
  transition:all .3s;
}
.tool-chip:hover{color:var(--ink);border-color:rgba(159,216,236,.45);}
.tool-chip .dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--ice);box-shadow:0 0 10px var(--ice);
  transition:all .3s;
}
.tool-chip.off .dot{background:var(--faint);box-shadow:none;}

/* ============================================================
   3D 热点 HTML 标签
   ============================================================ */
.hotspot-label{
  position:fixed;z-index:18;transform:translate(-50%,-130%);
  display:flex;align-items:center;gap:9px;
  padding:9px 16px 9px 10px;border-radius:999px;
  background:var(--glass);border:1px solid rgba(159,216,236,.35);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 8px 30px rgba(2,10,26,.5);
  font-size:12.5px;letter-spacing:.12em;white-space:nowrap;
  opacity:0;transition:opacity .4s ease;pointer-events:none;
}
.hotspot-label.show{opacity:1;}
.hotspot-label .badge{
  width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center;
  font-family:var(--serif);font-size:13px;font-weight:600;
  color:#061224;background:linear-gradient(135deg,#eaf6ff,#9fd8ec);
}
/* 悬停小岛提示气泡 */
.island-tip{
  position:fixed;z-index:24;pointer-events:none;
  padding:10px 18px;border-radius:999px;
  background:var(--glass-strong);border:1px solid rgba(159,216,236,.4);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font-size:12px;letter-spacing:.18em;color:var(--ink);
  box-shadow:0 10px 34px rgba(2,10,26,.55);
  opacity:0;transform:translate(-50%,-140%) scale(.92);
  transition:opacity .3s, transform .3s;
}
.island-tip.show{opacity:1;transform:translate(-50%,-140%) scale(1);}
.island-tip::after{
  content:'';position:absolute;left:50%;bottom:-6px;
  width:10px;height:10px;transform:translateX(-50%) rotate(45deg);
  background:var(--glass-strong);border-right:1px solid rgba(159,216,236,.4);
  border-bottom:1px solid rgba(159,216,236,.4);
}

/* ============================================================
   毛玻璃内容弹窗
   ============================================================ */
.modal-overlay{
  position:fixed;inset:0;z-index:50;
  display:grid;place-items:center;
  padding:5vh 5vw;
  background:rgba(3,9,22,.55);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:opacity .4s ease;
}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal-card{
  width:min(920px,100%);max-height:88vh;overflow-y:auto;
  background:linear-gradient(165deg,rgba(18,38,68,.82),rgba(8,19,38,.88));
  border:1px solid var(--line);border-radius:22px;
  box-shadow:0 30px 90px rgba(1,6,18,.7);
  padding:42px 46px;
  transform:translateY(26px) scale(.97);
  transition:transform .45s cubic-bezier(.22,1,.36,1);
  scrollbar-width:thin;scrollbar-color:rgba(159,216,236,.4) transparent;
}
.modal-overlay.show .modal-card{transform:translateY(0) scale(1);}
.modal-card::-webkit-scrollbar{width:6px;}
.modal-card::-webkit-scrollbar-thumb{background:rgba(159,216,236,.35);border-radius:3px;}
.modal-close{
  position:sticky;top:0;float:right;
  width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);display:grid;place-items:center;
  color:var(--muted);font-size:16px;transition:all .3s;
  background:rgba(10,22,42,.6);backdrop-filter:blur(8px);
}
.modal-close:hover{color:var(--ink);border-color:var(--ice);transform:rotate(90deg);}
.modal-head{margin-bottom:30px;}
.modal-head .en{font-size:11px;letter-spacing:.36em;color:var(--ice);margin-bottom:10px;}
.modal-head h2{font-family:var(--serif);font-size:38px;font-weight:600;letter-spacing:.04em;}
.modal-head .rule{width:54px;height:2px;margin-top:14px;background:linear-gradient(90deg,var(--ice),transparent);}

/* About */
.about-bio{color:var(--muted);line-height:2.1;font-size:14.5px;letter-spacing:.04em;}
.about-bio p+p{margin-top:12px;}
.skill-tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;}
.skill-tags span{
  padding:8px 18px;border-radius:999px;font-size:12.5px;letter-spacing:.1em;
  border:1px solid rgba(159,216,236,.35);color:var(--ice);
  background:rgba(159,216,236,.07);
}
.about-meta{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:32px;
}
.about-meta .cell{
  border:1px solid var(--line);border-radius:14px;padding:18px;
  background:rgba(159,216,236,.05);
}
.about-meta .num{font-family:var(--serif);font-size:30px;color:var(--ice);}
.about-meta .lbl{font-size:11px;letter-spacing:.2em;color:var(--faint);margin-top:6px;}

/* Projects */
.project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.project-card{
  border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:rgba(159,216,236,.05);
  transition:transform .35s, border-color .35s, box-shadow .35s;
  display:flex;flex-direction:column;
}
.project-card:hover{transform:translateY(-5px);border-color:rgba(159,216,236,.45);box-shadow:0 18px 44px rgba(2,10,26,.5);}
.project-cover{position:relative;aspect-ratio:16/10;overflow:hidden;background:#0e2138;}
.project-cover img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease;}
.project-card:hover .project-cover img{transform:scale(1.06);}
.project-cover .tag{
  position:absolute;top:12px;left:12px;
  padding:5px 12px;border-radius:999px;font-size:10.5px;letter-spacing:.14em;
  background:rgba(6,16,32,.66);border:1px solid var(--line);color:var(--ice);
  backdrop-filter:blur(8px);
}
.project-body{padding:20px;display:flex;flex-direction:column;flex:1;}
.project-body h3{font-family:var(--serif);font-size:21px;margin-bottom:9px;letter-spacing:.04em;}
.project-body p{font-size:12.5px;line-height:1.9;color:var(--muted);flex:1;}
.project-body .go{
  margin-top:16px;font-size:12px;letter-spacing:.16em;color:var(--ice);
  display:inline-flex;align-items:center;gap:7px;transition:gap .3s;
}
.project-card:hover .go{gap:12px;}
.modal-footer{margin-top:30px;text-align:center;}

/* Gallery */
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.gallery-item{
  position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;
  border:1px solid var(--line);cursor:pointer;
}
.gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease;}
.gallery-item:hover img{transform:scale(1.07);}
.gallery-item .cap{
  position:absolute;inset:auto 0 0 0;padding:34px 16px 14px;
  background:linear-gradient(transparent,rgba(4,10,24,.88));
  opacity:0;transform:translateY(10px);transition:all .4s ease;
}
.gallery-item:hover .cap{opacity:1;transform:translateY(0);}
.gallery-item .cap .place{font-family:var(--serif);font-size:17px;letter-spacing:.06em;}
.gallery-item .cap .date{font-size:10.5px;letter-spacing:.2em;color:var(--ice);margin:4px 0 6px;}
.gallery-item .cap .words{font-size:11.5px;color:var(--muted);line-height:1.7;}

/* Lightbox */
.lightbox{
  position:fixed;inset:0;z-index:70;
  display:grid;place-items:center;
  background:rgba(2,7,18,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  opacity:0;pointer-events:none;transition:opacity .35s;
}
.lightbox.show{opacity:1;pointer-events:auto;}
.lightbox img{max-width:88vw;max-height:74vh;border-radius:14px;border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.6);}
.lb-caption{text-align:center;margin-top:18px;}
.lb-caption .place{font-family:var(--serif);font-size:22px;}
.lb-caption .meta{font-size:11.5px;letter-spacing:.2em;color:var(--faint);margin-top:6px;}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:52px;height:52px;border-radius:50%;
  border:1px solid var(--line);background:var(--glass);
  display:grid;place-items:center;font-size:20px;color:var(--ice);
  backdrop-filter:blur(10px);transition:all .3s;
}
.lb-nav:hover{background:rgba(159,216,236,.2);}
.lb-prev{left:3vw;}
.lb-next{right:3vw;}
.lb-close{position:absolute;top:26px;right:3vw;}
.lb-counter{position:absolute;top:32px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.3em;color:var(--faint);}

/* Contact */
.contact-list{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.contact-row{
  display:flex;align-items:center;gap:16px;
  border:1px solid var(--line);border-radius:16px;padding:20px 22px;
  background:rgba(159,216,236,.05);transition:all .3s;
}
.contact-row:hover{border-color:rgba(159,216,236,.45);background:rgba(159,216,236,.1);}
.contact-row .ico{font-size:22px;width:38px;text-align:center;}
.contact-row .k{font-size:10.5px;letter-spacing:.24em;color:var(--faint);margin-bottom:5px;}
.contact-row .v{font-size:14px;letter-spacing:.05em;color:var(--ink);word-break:break-all;}
.contact-row.full{grid-column:1/-1;}
.copy-btn{
  margin-left:auto;flex:none;
  padding:8px 16px;border-radius:999px;font-size:11.5px;letter-spacing:.14em;
  border:1px solid rgba(159,216,236,.4);color:var(--ice);transition:all .3s;
}
.copy-btn:hover{background:rgba(159,216,236,.18);}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:90px;transform:translate(-50%,16px);
  z-index:90;padding:12px 26px;border-radius:999px;
  background:var(--glass-strong);border:1px solid rgba(159,216,236,.4);
  backdrop-filter:blur(12px);font-size:12.5px;letter-spacing:.16em;
  opacity:0;pointer-events:none;transition:all .35s;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* 探索模式下隐藏左上角品牌，避免与返回按钮重叠 */
.brand{transition:opacity .5s ease;}
body.is-explore .brand{opacity:0;pointer-events:none;}
/* 矮屏紧凑排版，避免首屏文案与导航/底栏重叠 */
@media (max-height:920px){
  .kicker{margin-bottom:18px;}
  .hero-intro{margin-top:18px;}
  .cta-primary{margin-top:26px;}
  .identity-tag{margin-top:28px;padding-top:14px;}
}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width:900px){
  .nav{padding:18px 5vw;}
  .nav-links .link{display:none;}
  .brand-text .sub{display:none;}
  .landing-panel{left:6vw;right:6vw;width:auto;top:13vh;transform:none;}
  .landing-panel.is-hidden{transform:translateY(-24px);}
  /* 移动端文字压在 3D 场景上时的柔和暗色衬底 */
  .landing-panel::before{
    content:'';position:fixed;z-index:-1;left:0;top:0;bottom:0;width:66%;
    background:linear-gradient(90deg,rgba(4,10,24,.66),rgba(4,10,24,.28) 72%,transparent);
    pointer-events:none;
  }
  .kicker{font-size:10px;letter-spacing:.26em;margin-bottom:16px;}
  .hero-title{font-size:clamp(32px,9vw,44px);}
  .hero-intro{font-size:13px;}
  .identity-tag{margin-top:26px;}
  .cta-primary{margin-top:26px;padding:14px 28px;}
  .slogan,.operate-hint{display:none;}
  .bottom-bar{justify-content:center;bottom:18px;}
  .landmark-pill button{padding:8px 12px;font-size:11px;}
  .view-tools{right:4vw;bottom:78px;flex-direction:row;}
  .tool-chip{padding:9px 13px;font-size:11px;}
  .back-btn{top:18px;left:5vw;}
  .modal-card{padding:30px 22px;}
  .modal-head h2{font-size:29px;}
  .project-grid{grid-template-columns:1fr;}
  .gallery-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .contact-list{grid-template-columns:1fr;}
  .about-meta{grid-template-columns:repeat(3,1fr);gap:8px;}
  .about-meta .cell{padding:12px 8px;text-align:center;}
  .about-meta .num{font-size:22px;}
  .hotspot-label{font-size:11px;padding:7px 12px 7px 8px;}
  .lb-nav{width:42px;height:42px;}
}
@media (max-width:420px){
  .brand-text .sub{letter-spacing:.22em;}
  .gallery-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<canvas id="scene-canvas"></canvas>

<!-- ============ 顶部导航 ============ -->
<header class="nav">
  <div class="brand">
    <div class="brand-logo" id="brand-logo">W</div>

   ════════════════════════════════════════════════════════════ */
function makeGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(255,244,220,.85)');
  g.addColorStop(0.6, 'rgba(255,220,160,.22)');
  g.addColorStop(1, 'rgba(255,220,160,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function makeSnowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.4, 'rgba(235,246,255,.75)');
  g.addColorStop(1, 'rgba(235,246,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
function makeAuroraTexture(hue) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 512, 256);
  // 几道柔和的光带
  for (let band = 0; band < 4; band++) {
    const y = 60 + band * 38;
    const grad = ctx.createLinearGradient(0, y - 70, 0, y + 70);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.5, hue[band % hue.length]);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, y);
    for (let x = 0; x <= 512; x += 32) {
      ctx.lineTo(x, y + Math.sin(x * 0.02 + band * 1.7) * 22);
    }
    ctx.lineTo(512, y + 90); ctx.lineTo(0, y + 90);
    ctx.closePath(); ctx.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const glowTex = makeGlowTexture();
const snowTex = makeSnowTexture();

function glowSprite(color = 0xffe6b0, size = 2, opacity = 1) {
  const m = new THREE.SpriteMaterial({

  });
  const s = new THREE.Sprite(m);
  s.scale.set(size, size, 1);
  return s;
}

function box(w, h, d, mat, x, y, z, parent = island, shadow = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function cyl(rt, rb, h, seg, mat, x, y, z, parent = island) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}

  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.ConeGeometry(r, h, 6), MAT.mountain);
  body.position.y = h / 2; body.castShadow = true;
  const capH = h * 0.44;

  island.add(g);

  trunk.position.y = 0.27 * s; trunk.castShadow = true;

    const cap = new THREE.Mesh(new THREE.ConeGeometry(r * 1.03 * s, h * 0.4 * s, 7), MAT.snow);
    cap.position.y = (y + h * 0.3) * s; cap.castShadow = true; g.add(cap);

/* ════════════════════════════════════════════════════════════
   ⑧ 状态机：首屏 Landing ⇄ 登岛 Explore（相机 Lerp 平滑过渡）
   ════════════════════════════════════════════════════════════ */
let state = 'landing';
let transition = null;
const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function flyTo(pos, target, duration = 1450) {
  return new Promise(resolve => {
    transition = {
      fromPos: camera.position.clone(), toPos: pos.clone(),
      fromTg: controls.target.clone(), toTg: target.clone(),
      start: performance.now(), duration, resolve
    };
    controls.enabled = false;
  });
}

const landingPanel = document.getElementById('landing-panel');
const bottomBar = document.getElementById('bottom-bar');
const backBtn = document.getElementById('back-btn');
const viewTools = document.getElementById('view-tools');

async function enterExplore() {
  if (state === 'exploring') return;
  state = 'exploring';
  document.body.classList.add('is-explore');
  landingPanel.classList.add('is-hidden');
  bottomBar.classList.add('is-hidden');
  backBtn.classList.add('show');
  viewTools.classList.add('show');
  await flyTo(VIEW_EXPLORE.pos, VIEW_EXPLORE.tg);
}
async function exitExplore() {
  if (state === 'landing') return;
  closeModal();
  state = 'landing';
  document.body.classList.remove('is-explore');
  backBtn.classList.remove('show');
  viewTools.classList.remove('show');
  hotspots.forEach(h => h.label.classList.remove('show'));
  await flyTo(VIEW_LANDING.pos, VIEW_LANDING.tg);
  landingPanel.classList.remove('is-hidden');
  bottomBar.classList.remove('is-hidden');
}
async function openLandmark(id) {
  if (state === 'landing') await enterExplore();
  const v = FOCUS_VIEW[id];
  await flyTo(v.pos, v.tg, 1300);
  openModal(id);
}

/* ════════════════════════════════════════════════════════════
   ⑨ 指针交互：区分“拖拽旋转”与“点击”（位移 < 5px 才算点击）
   ════════════════════════════════════════════════════════════ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const tip = document.getElementById('island-tip');
let downX = 0, downY = 0, isDown = false;

function setPointer(e) {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
}
function pickHotspot() {
  const hits = raycaster.intersectObjects(markerMeshes, false);
  return hits.length ? hits[0].object.userData.hotspot : null;
}
function pickIsland() {
  return raycaster.intersectObject(island, true).length > 0;
}

canvas.addEventListener('pointerdown', e => {
  isDown = true;
  downX = e.clientX; downY = e.clientY;
});
canvas.addEventListener('pointermove', e => {
  if (isDown) return;                 // 拖拽中不做悬停检测
  setPointer(e);
  const hp = pickHotspot();
  if (hp) {
    canvas.style.cursor = 'pointer';
    tip.classList.remove('show');
    return;
  }
  if (state === 'landing' && pickIsland()) {
    canvas.style.cursor = 'pointer';
    tip.style.left = e.clientX + 'px';
    tip.style.top = e.clientY + 'px';
    tip.classList.add('show');
  } else {
    canvas.style.cursor = 'grab';
    tip.classList.remove('show');
  }
});
canvas.addEventListener('pointerup', e => {
  if (!isDown) return;
  isDown = false;
  const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  if (moved >= 5) return;            // 判定为拖拽，不触发点击
  setPointer(e);
  const hp = pickHotspot();
  if (hp) { openLandmark(hp); return; }
  if (state === 'landing' && pickIsland()) enterExplore();
});
canvas.addEventListener('pointerleave', () => tip.classList.remove('show'));

/* ════════════════════════════════════════════════════════════
   ⑩ 毛玻璃弹窗：关于 / 作品 / 相册 / 联系
   ════════════════════════════════════════════════════════════ */
const modalOverlay = document.getElementById('modal-overlay');
const modalContent = document.getElementById('modal-content');

const MODAL_META = {
  about:    { en: 'ABOUT ME',    zh: '关于我' },
  projects: { en: 'PROJECTS',    zh: '作品集' },
  gallery:  { en: 'GALLERY',     zh: '光影相册' },
  contact:  { en: 'CONTACT ME',  zh: '联系我' }
};

function headHTML(id) {
  const m = MODAL_META[id];
  return `<div class="modal-head"><div class="en">${m.en}</div><h2>${m.zh}</h2><div class="rule"></div></div>`;
}
function openModal(id) {
  let html = headHTML(id);
  if (id === 'about') {
    html += `<div class="about-bio">${CONFIG.about.bio.map(p => `<p>${p}</p>`).join('')}</div>
      <div class="skill-tags">${CONFIG.about.skills.map(s => `<span>${s}</span>`).join('')}</div>
      <div class="about-meta">${CONFIG.about.stats.map(s =>
        `<div class="cell"><div class="num">${s.num}</div><div class="lbl">${s.label}</div></div>`).join('')}</div>`;
  }
  if (id === 'projects') {
    html += `<div class="project-grid">${CONFIG.projects.map(p => `
      <a class="project-card" href="${p.url}" target="_blank" rel="noopener noreferrer">
        <div class="project-cover">
          <img data-fb="项目封面" src="${p.cover}" alt="${p.title}" />
          <span class="tag">${p.tag}</span>
        </div>
        <div class="project-body">
          <h3>${p.title}</h3><p>${p.desc}</p>
          <span class="go">查看详情 ↗</span>
        </div>
      </a>`).join('')}</div>
      <div class="modal-footer">
        <a class="pill-btn" href="${CONFIG.allProjectsUrl}" target="_blank" rel="noopener noreferrer">查看全部作品 ↗</a>
      </div>`;
  }
  if (id === 'gallery') {
    html += `<div class="gallery-grid">${CONFIG.gallery.map((g, i) => `
      <figure class="gallery-item" data-idx="${i}">
        <img data-fb="风景照片" src="${g.src}" alt="${g.place}" />
        <figcaption class="cap">
          <div class="place">${g.place}</div>
          <div class="date">${g.date}</div>
          <div class="words">${g.caption}</div>
        </figcaption>
      </figure>`).join('')}</div>`;
  }
  if (id === 'contact') {
    html += `<div class="contact-list">
      <div class="contact-row full">
        <div class="ico">✉️</div>
        <div><div class="k">EMAIL · 邮箱</div><div class="v">${CONFIG.contact.email}</div></div>
        <button class="copy-btn" id="copy-email">复制</button>
      </div>
      ${CONFIG.contact.links.map(l => `
        <a class="contact-row full" href="${l.url}" target="_blank" rel="noopener noreferrer">
          <div class="ico">${l.icon}</div>
          <div><div class="k">${l.label}</div><div class="v">${l.value}</div></div>
          <div style="margin-left:auto;color:var(--ice)">↗</div>
        </a>`).join('')}
    </div>`;
  }
  modalContent.innerHTML = html;
  modalOverlay.classList.add('show');
  bindModalImages();
  if (id === 'gallery') {
    modalContent.querySelectorAll('.gallery-item').forEach(el =>
      el.addEventListener('click', () => openLightbox(Number(el.dataset.idx))));
  }
  if (id === 'contact') {
    document.getElementById('copy-email').addEventListener('click', copyEmail);
  }
}
function closeModal() {
  modalOverlay.classList.remove('show');
}
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
document.getElementById('modal-close').addEventListener('click', closeModal);

/* 图片加载失败时的本地冰霜渐变兜底（保证永远不出现裂图） */
function bindModalImages() {
  modalContent.querySelectorAll('img[data-fb]').forEach(img => {
    img.addEventListener('error', function once() {
      img.removeEventListener('error', once);
      const label = img.dataset.fb || 'winter island';
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600'>
        <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
        <stop offset='0' stop-color='#1d4e77'/><stop offset='1' stop-color='#0a1a33'/>
        </linearGradient></defs><rect width='800' height='600' fill='url(#g)'/>
        <text x='400' y='310' fill='#9fd8ec' font-size='34' font-family='serif' text-anchor='middle'>❄ ${label}</text></svg>`;
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    });
  });
}

/* —— 邮箱一键复制 —— */
const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}
async function copyEmail() {
  try {
    await navigator.clipboard.writeText(CONFIG.contact.email);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = CONFIG.contact.email;
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  showToast('邮箱已复制到剪贴板');
}

/* ════════════════════════════════════════════════════════════
   ⑪ 全屏灯箱（左右按钮 / 键盘方向键 / ESC）
   ════════════════════════════════════════════════════════════ */
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbPlace = document.getElementById('lb-place');
const lbMeta = document.getElementById('lb-meta');
const lbCounter = document.getElementById('lb-counter');
let lbIndex = 0;

function openLightbox(i) {
  lbIndex = i;
  renderLightbox();
  lightbox.classList.add('show');
}
function renderLightbox() {
  const item = CONFIG.gallery[lbIndex];
  lbImg.src = item.src;
  lbPlace.textContent = item.place;
  lbMeta.textContent = `${item.date} · ${item.caption}`;
  lbCounter.textContent = `${String(lbIndex + 1).padStart(2, '0')} / ${String(CONFIG.gallery.length).padStart(2, '0')}`;
}
function closeLightbox() { lightbox.classList.remove('show'); }
function lbStep(d) {
  lbIndex = (lbIndex + d + CONFIG.gallery.length) % CONFIG.gallery.length;
  renderLightbox();
}
document.getElementById('lb-prev').addEventListener('click', () => lbStep(-1));
document.getElementById('lb-next').addEventListener('click', () => lbStep(1));
document.getElementById('lb-close').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

/* 键盘：ESC 关闭 / ← → 切换 */
document.addEventListener('keydown', e => {
  if (lightbox.classList.contains('show')) {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') lbStep(-1);
    if (e.key === 'ArrowRight') lbStep(1);
    return;
  }
  if (e.key === 'Escape' && modalOverlay.classList.contains('show')) closeModal();
});

   ⑫ UI 绑定：导航 / 按钮 / 开关
   ════════════════════════════════════════════════════════════ */

/* ════════════════════════════════════════════════════════════
   ⑬ GLTFLoader 模型替换接口（未来把程序化模型换成 .glb 时使用）
   —— 在 CONFIG.MODEL_GLB_URL 填入你的 .glb 地址即可自动启用
   ════════════════════════════════════════════════════════════ */
function replaceWithGLB(url) {
  const loader = new GLTFLoader();
  loader.load(
    url,
    gltf => {
      // 1) 移除当前程序化浮岛（热点 / 星空 / 飘雪保留，不受影响）
      scene.remove(island);
      // 2) 载入外部模型并自动居中、缩放到与原岛近似尺寸
      const model = gltf.scene;
      const box3 = new THREE.Box3().setFromObject(model);
      const size = box3.getSize(new THREE.Vector3());
      const scale = 20 / Math.max(size.x, size.z);   // 以 20 单位宽为基准
      model.scale.setScalar(scale);
      model.position.y = -box3.min.y * scale - 0.4;
      model.traverse(o => {
        if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
      });
      scene.add(model);
      // 3) 若 .glb 内节点命名与热点 id 一致（about/projects/gallery/contact），
      //    可在此把 hotspotDefs 的位置对齐到对应节点：
      //    hotspotDefs.forEach(d => {
      //      const node = model.getObjectByName(d.id);
      //      if (node) node.getWorldPosition(d.pos);
      //    });
      console.log('[WinterIsland] GLB 模型替换成功:', url);
    },
    xhr => console.log('[WinterIsland] 模型加载中', (xhr.loaded / (xhr.total || 1) * 100).toFixed(0) + '%'),
    err => console.error('[WinterIsland] GLB 加载失败，请检查路径：', err)
  );
}
if (CONFIG.MODEL_GLB_URL) replaceWithGLB(CONFIG.MODEL_GLB_URL);

/* ════════════════════════════════════════════════════════════
   ⑭ 动画循环
   ════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  /* 相机过渡插值 */
  if (transition) {
    const k = Math.min(1, (performance.now() - transition.start) / transition.duration);
    const e = easeInOutCubic(k);
    camera.position.lerpVectors(transition.fromPos, transition.toPos, e);
    controls.target.lerpVectors(transition.fromTg, transition.toTg, e);
    if (k >= 1) {
      const cb = transition.resolve;
      transition = null;
      controls.enabled = true;
      cb();
    }
  }
  controls.update();

  /* 浮岛轻微上下浮动 */
  island.position.y = Math.sin(t * 0.55) * 0.18;

  /* 飘雪下落 + 横向漂移，落底回到顶部 */
  if (snowPoints.visible) {
    const arr = snowPoints.geometry.attributes.position.array;
    for (let i = 0; i < SNOW_COUNT; i++) {
      arr[i * 3 + 1] -= snowVel[i] * dt;
      arr[i * 3] += Math.sin(t * 0.8 + i) * 0.18 * dt;
      if (arr[i * 3 + 1] < -1.6) {
        arr[i * 3 + 1] = 24;
        arr[i * 3] = THREE.MathUtils.randFloatSpread(44);
        arr[i * 3 + 2] = THREE.MathUtils.randFloatSpread(44);
      }
    }
    snowPoints.geometry.attributes.position.needsUpdate = true;
  }

  /* 极光呼吸 + 缓慢横移 */
  auroraMeshes.forEach((m, i) => {
    m.material.opacity = 0.24 + Math.sin(t * 0.35 + i * 1.4) * 0.1;
    m.position.x += Math.sin(t * 0.1 + i) * 0.004;
  });

  /* 热点脉冲 + HTML 标签屏幕投影 */
  hotspots.forEach(h => {
    const pulse = 1 + Math.sin(t * 2.2 + h.phase) * 0.16;
    h.ring.scale.setScalar(pulse);
    h.group.position.y = h.baseY + Math.sin(t * 1.2 + h.phase) * 0.22;
    h.group.getWorldPosition(tmpV);
    const show = state === 'exploring' && !modalOverlay.classList.contains('show');
    h.label.classList.toggle('show', show);
    if (show) {
      const v = tmpV.clone().project(camera);
      if (v.z > 1) { h.label.classList.remove('show'); return; }
      h.label.style.left = ((v.x * 0.5 + 0.5) * window.innerWidth) + 'px';
      h.label.style.top = ((-v.y * 0.5 + 0.5) * window.innerHeight) + 'px';
    }
  });

  renderer.render(scene, camera);
}
animate();

/* ════════════════════════════════════════════════════════════
   ⑮ 响应式
   ════════════════════════════════════════════════════════════ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
